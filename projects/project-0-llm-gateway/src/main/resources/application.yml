server:
  port: 8080

spring:
  application:
    name: llm-gateway
  data:
    redis:
      host: localhost
      port: 6379

app:
  conversation:
    # memory（默认，免装 Redis）| redis
    store: memory

  llm:
    # OpenAI 兼容接口。换成通义 / Kimi / 本地 vLLM、Ollama 只需改这两行
    base-url: https://api.deepseek.com
    api-key: ${DEEPSEEK_API_KEY:}
    # ⚠️ 模型名会变，以 DeepSeek 官方文档当前版本为准。
    #    旧别名 deepseek-chat / deepseek-reasoner 已于 2026-07-24 下线。
    #    便宜档位可换 deepseek-v4-flash。
    model: deepseek-v4-pro
    max-tokens: 4096
    system-prompt: "你是一个简洁、准确的助手。回答用中文。"
    max-history-messages: 20
    session-ttl: 1h
    connect-timeout: 10s
    read-timeout: 120s

  demo:
    # #01 首个请求演示，默认关闭——开启后每次启动都会真实调用一次 API（花钱）
    first-request: false

logging:
  level:
    com.study.llmgateway: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  health:
    redis:
      # 引了 redis starter 后健康检查默认会连 Redis，没装时 /actuator/health 直接 DOWN。
      # 默认用内存存储，所以关掉；切到 app.conversation.store=redis 时改成 true。
      enabled: false
